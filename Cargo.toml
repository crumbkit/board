[workspace]
members = [
    "crates/board-cli",
    "crates/board-index",
    "crates/board-model",
    "crates/board-ops",
    "crates/board-plugin",
    "crates/board-plugin-boundary",
    "crates/board-plugin-controls",
    "crates/board-plugin-evals",
    "crates/board-plugin-github",
    "crates/board-plugin-jira",
    "crates/board-plugin-plans",
    "crates/board-plugin-requests",
    "crates/board-plugin-runs",
    "crates/board-plugins",
    "crates/board-scenario",
    "crates/board-serve",
    "crates/board-tree",
    "crates/board-validate",
    "xtask",
]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false
rust-version = "1.97"

[workspace.dependencies]
# 0.13.5 and later depend on bolero-generator-derive, which pins indexmap =2.11.2
# and so conflicts with toml's indexmap ^2.13 (xtask).
bolero = "0.13.4"
board-index = { path = "crates/board-index", version = "0.0.0" }
board-ops = { path = "crates/board-ops", version = "0.0.0" }
board-model = { path = "crates/board-model", version = "0.0.0" }
board-plugin = { path = "crates/board-plugin", version = "0.0.0" }
board-plugin-boundary = { path = "crates/board-plugin-boundary", version = "0.0.0" }
board-plugin-controls = { path = "crates/board-plugin-controls", version = "0.0.0" }
board-plugin-evals = { path = "crates/board-plugin-evals", version = "0.0.0" }
board-plugin-github = { path = "crates/board-plugin-github", version = "0.0.0" }
board-plugin-jira = { path = "crates/board-plugin-jira", version = "0.0.0" }
board-plugin-plans = { path = "crates/board-plugin-plans", version = "0.0.0" }
board-plugin-requests = { path = "crates/board-plugin-requests", version = "0.0.0" }
board-plugin-runs = { path = "crates/board-plugin-runs", version = "0.0.0" }
board-plugins = { path = "crates/board-plugins", version = "0.0.0" }
board-scenario = { path = "crates/board-scenario", version = "0.0.0" }
board-serve = { path = "crates/board-serve", version = "0.0.0" }
board-tree = { path = "crates/board-tree", version = "0.0.0" }
board-validate = { path = "crates/board-validate", version = "0.0.0" }
# unstable-dynamic: completion that asks the binary, so paths complete from the
# board. The API may change in any release, so the version is exact and an
# upgrade is deliberate; only board-cli/src/complete.rs uses it.
clap_complete = { version = "=4.6.11", features = ["unstable-dynamic"] }
# crumbkit prints every command's reports, failures and help; crumbkit-test's convention
# checks run against the built binary. Unreleased, so pinned by rev; the
# version satisfies deny.toml's wildcards.
crumbkit = { git = "https://github.com/crumbkit/crumbkit", rev = "5589a9099cb1fa7f9ae8e77113fd08c45af6cb62", version = "0.0.0", default-features = false }
crumbkit-test = { git = "https://github.com/crumbkit/crumbkit", rev = "5589a9099cb1fa7f9ae8e77113fd08c45af6cb62", version = "0.0.0", default-features = false }
clap = { version = "4.6.7", default-features = false, features = ["derive", "error-context", "help", "std", "suggestions", "usage"] }
# board serve compares the per-launch token in constant time.
constant_time_eq = "0.6.1"
# board serve's per-launch token. gix already brings this version in.
getrandom = "0.3.4"
gix = { version = "0.88.0", default-features = false, features = ["excludes", "parallel", "sha1"] }
# The UTC time a pending effect records as `asked`. clap already brings this
# crate in.
humantime = "2.4.0"
jsonschema = { version = "0.58.5", default-features = false }
jsonschema-regex = "0.58.5"
# The owner's home from the passwd entry, which no variable a caller sets can
# move, so the signer and allowed signers file an approval trusts stay put.
# Without default features it brings only libc, bitflags and cfg-if; only
# board-cli/src/config.rs uses it.
nix = { version = "0.31.3", default-features = false, features = ["user"] }
# A Markdown link names a path percent-encoded, as a URL does. gix already
# brings this crate in.
percent-encoding = "2.3.2"
proptest = "1.11.0"
# Links in Markdown files are references. A CommonMark parser tells a link
# from the same text in a code span, a fenced block or an HTML block, and
# resolves reference links; Board had none. Without the html and getopts
# features it brings only bitflags, memchr and unicase.
# The index keys each Markdown blob's links by blob, so an upgrade that
# changes which links are found must also bump INDEX_VERSION in
# board-index/src/schema.rs, or a warm index keeps the old links.
pulldown-cmark = { version = "0.13.4", default-features = false }
regex = "1.12.2"
# The column of a syntax error in a pattern rule's expression, which regex's
# own error gives only inside a message that quotes the expression. regex
# already brings this version in.
regex-syntax = { version = "0.8.11", default-features = false, features = ["std", "unicode"] }
# A symlink text in a refusal escapes Unicode format characters, such as
# U+202E, which reorder text. jsonschema already brings this crate in.
unicode-general-category = "1.1.0"
# Markdown files hold YAML frontmatter, which Board reads as a record. A
# YAML 1.2 event parser in pure Rust, with no unsafe code, that brings only
# arraydeque; Board builds the JSON value from its events, so it decides
# which YAML is inside the JSON-compatible subset. The index keys each
# Markdown blob's fact by blob, so an upgrade that changes what parses must
# also bump INDEX_VERSION in board-index/src/schema.rs.
# Its events decide each Markdown record's indexed value, so a bump needs
# an INDEX_VERSION review (crates/board-index).
saphyr-parser = "=0.1.2"
# bundled: every platform runs the same SQLite, built from source.
# modern_sqlite: a refresh asks whether its transaction took the write lock.
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "cache", "hooks", "limits", "modern_sqlite"] }
# process: ask a plugin to stop with SIGTERM without unsafe code.
rustix = { version = "1.1.5", default-features = false, features = ["process", "std"] }
# board serve holds its per-launch token as a secret that Debug redacts.
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
# derive: the rows crumbkit prints describe their own JSON Schema.
schemars = { version = "1.2.2", default-features = false, features = ["derive", "std"] }
# iterator: forward Ctrl-C to a plugin's process group from a thread, with no
# async runtime and no unsafe code.
signal-hook = { version = "0.4.4", default-features = false, features = ["iterator"] }
# float_roundtrip parses floats exactly rounded, so a number Board reads back
# from its own output keeps its value; the default parse is approximate.
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
sha2 = "0.11.0"
# Already in the tree through clap's suggestions.
strsim = "0.11.1"
tempfile = "3.20.0"
thiserror = "2.0.18"
# board serve's HTTP server: synchronous, with no async runtime and no TLS.
tiny_http = { version = "0.12.0", default-features = false }
toml = { version = "1.1.6", default-features = false, features = ["parse", "serde", "std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
dbg_macro = "deny"
unwrap_used = "deny"
todo = "deny"
unimplemented = "deny"
panic = "deny"
undocumented_unsafe_blocks = "deny"
disallowed_methods = "deny"
disallowed_macros = "deny"
disallowed_types = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
mod_module_files = "deny"
print_stdout = "deny"
print_stderr = "deny"

# `cargo xtask profile` builds board as release does, with line tables so
# samply can name each frame's function and line.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = false

# What cargo-bolero builds fuzz targets with (.github/workflows/fuzz.yml):
# optimised, with debug assertions on, and one codegen unit, which bolero
# needs to avoid known miscompilations.
[profile.fuzz]
inherits = "dev"
opt-level = 3
codegen-units = 1

# Tests hash and compress files of up to 16 MiB through these crates. Built
# unoptimised, the fourteen tests that do took 20.9 s on two threads on a
# laptop and about 70 s on CI; optimised, 2.8 s on the laptop. Only these three
# crates are optimised, so a clean build costs little more.
[profile.dev.package.sha1dc]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.zlib-rs]
opt-level = 3
