[workspace]
members = ["crates/board-model", "crates/board-tree", "xtask"]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false
rust-version = "1.97"

[workspace.dependencies]
board-model = { path = "crates/board-model", version = "0.0.0" }
gix = { version = "0.88.0", default-features = false, features = ["sha1"] }
glob = "0.3.3"
proptest = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.20.0"
thiserror = "2.0.18"
toml = { version = "1.1.6", default-features = false, features = ["parse", "serde", "std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
dbg_macro = "deny"
unwrap_used = "deny"
todo = "deny"
unimplemented = "deny"
panic = "deny"
undocumented_unsafe_blocks = "deny"
disallowed_methods = "deny"
disallowed_macros = "deny"
disallowed_types = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
mod_module_files = "deny"
print_stdout = "deny"
print_stderr = "deny"
