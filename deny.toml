[graph]
all-features = true

[advisories]
# An exception names the advisory id and why it does not apply.
ignore = []
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# A wrapped crate may only be a direct dependency of the crates listed, so the
# rest of the workspace cannot reach past the owner (STANDARDS.md 7). Until an
# owner crate exists cargo-deny warns `unused-wrapper`, and the crate is
# refused everywhere.
deny = [
    { crate = "gix", wrappers = ["board-scenario", "board-tree"] },
    { crate = "rusqlite", wrappers = ["board-index"] },
    { crate = "jsonschema", wrappers = ["board-validate"] },
    # crumbkit reads the terminal width with rustix; Board never asks it to,
    # because it builds every sink with Sink::new over a buffer.
    # board-tree's tests check that a stopped sync leaves no process running;
    # board-plugin's sign module checks who owns the allowed signers file.
    # crumbkit-process starts, signals and reaps every child Board runs.
    # crossterm, under board-top's ratatui, puts the terminal in raw mode.
    { crate = "rustix", wrappers = ["board-plugin", "board-tree", "crossterm", "crumbkit", "crumbkit-process", "gix-index", "tempfile"] },
    # board-plugin's process module sets the flag `board ui` stops on, and
    # crumbkit-process's forward feature forwards stop signals to every
    # child group Board runs.
    # crossterm and its signal-hook-mio read the terminal resize signal for
    # board-top.
    { crate = "signal-hook", wrappers = ["board-plugin", "crossterm", "crumbkit-process", "signal-hook-mio"] },
    # board-cli's config module reads the passwd entry's home. process-wrap,
    # crumbkit-process's dependency on Windows only, runs a child in a job
    # object.
    { crate = "nix", wrappers = ["board-cli", "process-wrap"] },
    # board-cli's config module reads the local time zone, and gix dates
    # commits; a plugin gets the UTC offset in Settings.
    { crate = "jiff", wrappers = ["board-cli", "gix-date"] },
    { crate = "tiny_http", wrappers = ["board-serve"] },
    # board-plugin's process module runs plugin, signer and built-in children
    # and forwards signals through crumbkit-process; board-tree's transport
    # module runs git through it.
    { crate = "crumbkit-process", wrappers = ["board-plugin", "board-tree"] },
    { crate = "jsonschema-regex", wrappers = ["board-validate", "jsonschema"] },
    # Signatures are checked only by /usr/bin/ssh-keygen, through
    # board-plugin's sign module (STANDARDS.md 29), so no crate may sign or
    # verify in process.
    { crate = "ssh-key", reason = "signatures are verified only by ssh-keygen" },
    { crate = "ssh-encoding", reason = "signatures are verified only by ssh-keygen" },
    { crate = "p256", reason = "signatures are verified only by ssh-keygen" },
    { crate = "ecdsa", reason = "signatures are verified only by ssh-keygen" },
    { crate = "openssl", reason = "signatures are verified only by ssh-keygen" },
]

[licenses]
# The workspace is proprietary and unpublished; only dependencies are checked.
private = { ignore = true }
allow = ["Apache-2.0", "MIT", "MIT-0", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git = "deny"
