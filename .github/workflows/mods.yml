# Runs the tests of each Claude Code mod, `plugins/<name>/claude-code/`, when a
# pull request or a push to main changes a file under a `claude-code/`
# directory, the marketplace or this file. The tests stand in for board and
# need no credential. It also checks that the marketplace lists every mod.
name: mods

on:
  pull_request:
    paths:
      - "**/claude-code/**"
      - .claude-plugin/marketplace.json
      - .github/workflows/mods.yml
  push:
    branches: [main]
    paths:
      - "**/claude-code/**"
      - .claude-plugin/marketplace.json
      - .github/workflows/mods.yml

permissions:
  contents: read

concurrency:
  group: mods-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      # The exact version the mods' tests were last run with locally. The
      # rules mod needs `$.session.append`, which 2.1.289 lacks.
      - run: npm install --global @anthropic-ai/claude-code@2.1.308 # zizmor: ignore[adhoc-packages]
      - name: claude plugin test, for each mod
        run: |
          for mod in plugins/*/claude-code; do
            echo "::group::$mod"
            claude plugin test "$mod"
            echo "::endgroup::"
          done
      # Each mod that draws in the band keeps a copy of the attention mod's
      # band.ts, whose tests only the attention mod runs.
      - name: every band.ts matches the attention mod's
        run: |
          for copy in plugins/*/claude-code/hooks/band.ts; do
            cmp -s plugins/attention/claude-code/hooks/band.ts "$copy" \
              || { echo "::error file=$copy::$copy differs from plugins/attention/claude-code/hooks/band.ts"; exit 1; }
          done
      # Every mod has an entry whose name is its plugin.json name and whose
      # source is its directory, so `claude plugin install <name>@board`
      # finds it.
      - name: the marketplace lists every mod
        run: |
          for mod in plugins/*/claude-code; do
            name=$(jq -r .name "$mod/.claude-plugin/plugin.json")
            jq -e --arg name "$name" --arg source "./$mod" \
              'any(.plugins[]; .name == $name and .source == $source)' \
              .claude-plugin/marketplace.json >/dev/null \
              || { echo "::error::.claude-plugin/marketplace.json has no entry for $name at ./$mod"; exit 1; }
          done
      # `claude plugin update` installs a mod only when its version changes,
      # so a changed mod needs a higher version than the base branch has.
      - name: a changed mod raises its version
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base=$(git merge-base "origin/$BASE_REF" HEAD)
          for mod in plugins/*/claude-code; do
            git diff --quiet "$base" HEAD -- "$mod" && continue
            file="$mod/.claude-plugin/plugin.json"
            old=$(git show "$base:$file" 2>/dev/null | jq -r .version) || continue
            [ -n "$old" ] || continue
            new=$(jq -r .version "$file")
            if [ "$(printf '%s\n%s\n' "$old" "$new" | sort -V | tail -n1)" != "$new" ] || [ "$old" = "$new" ]; then
              echo "::error file=$file::$mod changed but its version is $new, not above $old on $BASE_REF; raise the version in $file"
              exit 1
            fi
          done
      - run: claude plugin validate .
