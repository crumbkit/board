# STANDARDS.md 19: the bolero targets the gate runs as quick randomised tests
# are fuzzed here, coverage-guided, on the nightly toolchain. slow.yml calls
# this workflow nightly and before a release, and reports a failure.
name: fuzz

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        package: [board-model]
        target:
          - json::tests::bolero_any_bytes_parse_to_a_value_that_parses_back_to_itself
          - json::tests::bolero_canonical_output_reads_back_as_the_same_value_and_bytes
          - record::tests::bolero_classifying_any_bytes_never_panics_and_unparsed_content_has_a_code
          - path::tests::bolero_any_text_is_admitted_exactly_or_refused_as_malformed
          - markdown::tests::bolero_any_bytes_give_links_that_name_paths
          - frontmatter::tests::bolero_any_bytes_give_frontmatter_or_an_error_with_its_code
        include:
          - package: board-plugin-plans
            target: open::asked::tests::bolero_any_text_is_read_as_an_instant_only_in_the_shape_of_one
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal
      # Pinned so its flags cannot drift; -T is the total run time.
      - run: cargo +nightly install cargo-bolero --version 0.13.5 --locked
      - run: cargo +nightly bolero test --package ${{ matrix.package }} -T 10min ${{ matrix.target }}
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crashes-${{ strategy.job-index }}
          path: crates/${{ matrix.package }}/src/**/__fuzz__/*/crashes/
          if-no-files-found: ignore
