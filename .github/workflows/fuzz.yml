# STANDARDS.md 19: the bolero targets the gate runs as quick randomised tests
# are fuzzed here, coverage-guided, on nightly.
name: fuzz

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        target:
          - json::tests::bolero_any_bytes_parse_to_a_value_that_parses_back_to_itself
          - json::tests::bolero_canonical_output_reads_back_as_the_same_value_and_bytes
          - record::tests::bolero_classifying_any_bytes_never_panics_and_unparsed_content_has_a_code
          - path::tests::bolero_any_text_is_admitted_exactly_or_refused_as_malformed
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal
      # Pinned so its flags cannot drift; -T is the total run time.
      - run: cargo +nightly install cargo-bolero --version 0.13.5 --locked
      - run: cargo +nightly bolero test --package board-model -T 10min ${{ matrix.target }}
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crashes-${{ strategy.job-index }}
          path: crates/board-model/src/**/__fuzz__/*/crashes/
          if-no-files-found: ignore

  # A scheduled failure shows nowhere else, so it opens one issue and later
  # failures comment on it until someone closes it.
  report:
    needs: fuzz
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Scheduled fuzzing failed"
          body="$RUN failed. Each failing target's crash inputs are in the run's crashes-* artifacts."
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
