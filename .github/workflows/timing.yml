# STANDARDS.md 20: the timing job. It times Board on a generated
# 10,000-record board against the budgets in docs/architecture.md, reports
# every run, and fails above three times a budget. The work-count tests in
# bin/test are the hard gate; this job only watches the trend.
name: timing

on:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "17 5 * * 1"
  pull_request:
    paths:
      - "xtask/src/bench.rs"
      - "xtask/src/bench/**"
      - "xtask/src/main.rs"
      - "plugins/tasks/**"
      - ".github/workflows/timing.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  timing:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # The plugin call row runs the tasks plugin through uv, as Board does,
      # and the plugin runs the board built beside xtask. Without uv, bench
      # skips that row and says so; without the board, bench fails.
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.13.0"
      - run: uv sync --frozen --no-dev
        working-directory: plugins/tasks
      - run: cargo build --release --locked --package board-cli
      - run: cargo run --release --locked --package xtask -- bench
