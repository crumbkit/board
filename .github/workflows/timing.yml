# STANDARDS.md 20: the timing job. It times Board on a generated
# 10,000-record board against the budgets in docs/architecture/performance/budgets.md, reports
# every run, and fails above three times a budget. The work-count tests in
# bin/test are the hard gate; this job only watches the trend. slow.yml calls
# it nightly and before a release, with the macOS leg on Monday nights and
# before a release only; a pull request that changes the bench can run it by
# hand.
name: timing

on:
  workflow_dispatch:
    inputs:
      macos:
        description: Time on macOS as well as Linux.
        type: boolean
        default: true
  workflow_call:
    inputs:
      macos:
        description: Time on macOS as well as Linux.
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  timing:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ inputs.macos && fromJSON('["ubuntu-24.04", "macos-15"]') || fromJSON('["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: cargo run --release --locked --package xtask -- bench
