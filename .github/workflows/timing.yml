# STANDARDS.md 20: the timing job. It times Board on a generated
# 10,000-record board against the budgets in docs/architecture.md, reports
# every run, and fails above three times a budget. The work-count tests in
# bin/test are the hard gate; this job only watches the trend.
name: timing

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"
  pull_request:
    paths:
      - "xtask/src/bench.rs"
      - "xtask/src/bench/**"
      - ".github/workflows/timing.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  timing:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: cargo run --release --locked --package xtask -- bench
