# STANDARDS.md 21: the slow lane. It runs what costs too much or catches too
# little to run on every pull request: the gates on macOS, mutation testing,
# fuzzing and the timing job. It runs nightly on main, by hand, and from
# release.yml before a release, which skips mutants. The jobs on macOS run in
# the Monday night run only, and in every hand-run and release run.
name: slow

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      mutants-base:
        description: Commit to mutate the changes since; the diff starts where it meets this run's commit. Empty means the nightly base. It does not move the nightly base.
        type: string
        default: ""
  workflow_call:
    inputs:
      release:
        description: Run for a release, which skips mutants.
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The commit the mutants start from. A hand-run may name one with
  # mutants-base; it does not move the nightly base, which comes only from
  # scheduled runs. Otherwise the base is the head of the newest scheduled run
  # of the last 3 days whose mutants jobs all passed, so a night that fails
  # for another reason still moves it. A shard cancelled by its timeout never
  # passes, so the window bounds a failing streak's range to about 4 days of
  # changes. With no such run, it is the last commit before 00:00 UTC of the
  # previous day. A scheduled run whose main has not changed since the
  # previous scheduled run skips Linux timing and mutants. A run in which any
  # job timed out ends cancelled, as a hand-cancelled run does, so neither
  # counts as that previous run, and the next night runs them again.
  #
  # A macOS runner bills ten times a Linux one, so of the scheduled runs only
  # Monday's runs macos and timing's macOS leg. It skips them when main has
  # not changed since the previous Monday run whose macos job passed, so after
  # a Monday whose macos job failed or was cancelled, the next Monday runs it
  # again. It does not compare with Sunday's run, which skipped macOS.
  base:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      base: ${{ steps.base.outputs.base }}
      run: ${{ steps.base.outputs.run }}
      macos: ${{ steps.base.outputs.macos }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: base
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          GIVEN: ${{ inputs.mutants-base }}
        run: |
          gh run list --workflow slow.yml --event schedule --branch main --status completed --limit 20 \
            --json databaseId,headSha,createdAt,conclusion > runs.json
          if [ -n "$GIVEN" ]; then
            base=$(git rev-parse --verify --end-of-options "$GIVEN^{commit}")
            how="mutants-base was given as $GIVEN"
          else
            base=
            window=$(date -u -d '3 days ago' +%s)
            for run in $(jq -r --argjson since "$window" '.[] | select((.createdAt | fromdateiso8601) >= $since) | .databaseId' runs.json); do
              passed=$(gh api "repos/$GH_REPO/actions/runs/$run/jobs?per_page=100" \
                --jq '[.jobs[] | select(.name | startswith("mutants")) | .conclusion] | length > 0 and all(. == "success")')
              if [ "$passed" = true ]; then
                base=$(jq -r --argjson run "$run" '.[] | select(.databaseId == $run) | .headSha' runs.json)
                how="the head of scheduled run $run, the newest of the last 3 days whose mutants all passed"
                break
              fi
            done
            if [ -z "$base" ]; then
              base=$(git rev-list -1 --before="$(date -u -d yesterday +%F)T00:00:00Z" HEAD)
              how="the last commit before 00:00 UTC of the previous day; no scheduled run of the last 3 days had all its mutants pass"
            fi
          fi
          previous=$(jq -r '[.[] | select(.conclusion != "cancelled")][0].headSha // empty' runs.json)
          run=true
          if [ "$EVENT" = schedule ] && [ "$previous" = "$GITHUB_SHA" ]; then
            run=false
          fi
          macos=true
          if [ "$EVENT" = schedule ]; then
            # A re-run keeps its run's creation time, so the day comes from it.
            created=$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
            if [ "$(date -u -d "$created" +%u)" != 1 ]; then
              macos=false
            else
              # gmtime's seventh field is the day of the week; 1 is Monday.
              for monday in $(jq -r '.[] | select((.createdAt | fromdateiso8601 | gmtime | .[6]) == 1) | .databaseId' runs.json); do
                passed=$(gh api "repos/$GH_REPO/actions/runs/$monday/jobs?per_page=100" \
                  --jq '[.jobs[] | select(.name == "macos") | .conclusion] == ["success"]')
                if [ "$passed" = true ]; then
                  tested=$(jq -r --argjson run "$monday" '.[] | select(.databaseId == $run) | .headSha' runs.json)
                  if [ "$tested" = "$GITHUB_SHA" ]; then
                    macos=false
                  fi
                  break
                fi
              done
            fi
          fi
          {
            echo "Mutants base: ${base:-none} ($how)."
            if [ "$run" = false ]; then
              echo "main has not changed since the previous scheduled run, so Linux timing and mutants are skipped."
            fi
            if [ "$macos" = false ]; then
              echo "The jobs on macOS run on Monday nights, unless main has not changed since the previous Monday run whose macos job passed, so this run skips them."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "macos=$macos" >> "$GITHUB_OUTPUT"

  macos:
    needs: base
    if: needs.base.outputs.macos == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-nextest@0.9.146
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.13.0"
      - run: bin/lint
      - run: bin/test

  # Fuzzing is randomised, so it runs every night, even on an unchanged main.
  fuzz:
    uses: $/.github/workflows/fuzz.yml

  # A Monday run on an unchanged main still times Linux when it times macOS.
  timing:
    needs: base
    if: needs.base.outputs.run == 'true' || needs.base.outputs.macos == 'true'
    uses: $/.github/workflows/timing.yml
    with:
      macos: ${{ needs.base.outputs.macos == 'true' }}

  # Mutation testing of the lines changed since the base commit. A release
  # skips it: a mutant does not gate a release, and the nightly run has
  # already covered each day's changes. Each mutant runs the whole
  # workspace's tests, because board-cli's tests catch mutants in the crates
  # it calls. board-scenario is test support with no tests of its own, and
  # cargo-mutants runs its baseline on the mutated crates only, so it is not
  # mutated. cargo-mutants sets each mutant's test timeout to five times that
  # baseline, which can be shorter than one run of the whole workspace (50 to
  # 66 s here), so the timeout is at least 180 s. Nextest's mutants profile
  # fails a test that runs past a minute and stops at the first failure, so a
  # mutant that makes a walk wait forever fails its run and counts as caught.
  # The baseline runs only the mutated crates' tests, so it does not check
  # that every test finishes within that minute. Once a correct test
  # approaches 60 s here, every mutant fails it and counts as caught, which
  # would hide missed mutants. A missed mutant fails the job, which the
  # report job surfaces.
  mutants:
    needs: base
    if: needs.base.outputs.run == 'true' && needs.base.outputs.base != '' && !inputs.release
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest@0.9.146
      - id: diff
        run: |
          git diff --end-of-options "$BASE...HEAD" -- '*.rs' > changes.diff
          echo "mutating the changes since $BASE" >> "$GITHUB_STEP_SUMMARY"
          if [ -s changes.diff ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi
        env:
          BASE: ${{ needs.base.outputs.base }}
      # Without debug info each mutant rebuilds faster. A panic in a mutant's
      # log still names its file and line; only backtrace frames lose them.
      - if: steps.diff.outputs.changed == 'true'
        run: cargo mutants --in-diff changes.diff --test-tool nextest --test-workspace=true --exclude 'crates/board-scenario/**' --minimum-test-timeout 180 --shard "${SHARD}/8"
        env:
          SHARD: ${{ matrix.shard }}
          NEXTEST_PROFILE: mutants
          CARGO_PROFILE_DEV_DEBUG: "0"
      - if: always() && steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutants-${{ matrix.shard }}
          path: mutants.out/
          if-no-files-found: ignore

  # A nightly failure shows nowhere else, so it opens one issue and later
  # failures comment on it until someone closes it. A job that runs past its
  # timeout ends cancelled, and so does the run's conclusion, but cancelled()
  # stays false for the jobs after it, so it is reported. A run cancelled by
  # hand makes cancelled() true and reports nothing.
  report:
    needs: [base, macos, fuzz, timing, mutants]
    if: ${{ !cancelled() && github.event_name == 'schedule' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULTS: "base: ${{ needs.base.result }}, macos: ${{ needs.macos.result }}, fuzz: ${{ needs.fuzz.result }}, timing: ${{ needs.timing.result }}, mutants: ${{ needs.mutants.result }}"
        run: |
          title="Slow lane failed"
          body="$RUN failed ($RESULTS). A fuzz failure's crash inputs are in its crashes-* artifacts, and missed mutants are in the mutants-* artifacts."
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
