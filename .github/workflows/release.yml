# A release: the pull-request lane and the slow lane's git-floor job (the
# tests that spawn git against git 2.39), then `board` built with
# `cargo auditable` for each target, bin/install-check run from the archives
# on each platform, and the archives attached to a GitHub release with
# SHA256SUMS and a build provenance attestation for each archive. The tag is
# `v<version>`, where <version> is board-cli's version in its Cargo.toml, and
# released.json must list what the release ships
# (docs/architecture/released.md).
# A pull request that changes this file, and workflow_dispatch, build and
# install-check every archive and publish nothing. A pull request skips the
# two lanes, which ci.yml already runs on it.
name: release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [.github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    if: github.event_name != 'pull_request'
    uses: $/.github/workflows/ci.yml

  # A called workflow may not ask for more than its caller grants. The slow
  # lane's base job reads earlier runs, and its report job may open an issue
  # on a nightly failure; it opens none here. A release runs only the slow
  # lane's base and git-floor jobs, and skips macOS, fuzzing, timing and
  # mutants, which the nightly runs cover.
  slow:
    if: github.event_name != 'pull_request'
    uses: $/.github/workflows/slow.yml
    permissions:
      actions: read
      contents: read
      issues: write
    with:
      release: true

  # The tag names the version the binary prints, and released.json lists
  # what the release ships.
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: version
        run: |
          version=$(cargo pkgid --package board-cli | sed 's/.*[#@]//')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "the tag is ${GITHUB_REF_NAME} and board-cli's Cargo.toml says $version" >&2
            exit 1
          fi
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-nextest@0.9.146
      - run: cargo nextest run --locked --package board-cli -- released
        env:
          RELEASED: all

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
          # Built and install-checked natively on Intel. When GitHub retires
          # this image, cross-compile on macos-15 or drop the target.
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup target add "$TARGET"
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-auditable@0.7.7
          fallback: none
      # rust-standards BASE-30: the binary records the dependency versions it
      # contains.
      - run: cargo auditable build --release --locked --package board-cli --target "$TARGET"
      - run: |
          mkdir dist
          tar -C "target/$TARGET/release" -czf "dist/board-$VERSION-$TARGET.tar.gz" board
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: board-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  # A fresh machine installs the release from its archive and runs init,
  # plugin enable, put and call.
  install:
    needs: [version, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
          # Built and install-checked natively on Intel. When GitHub retires
          # this image, cross-compile on macos-15 or drop the target.
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: board-${{ matrix.target }}
          path: dist
      - run: bin/install-check "dist/board-$VERSION-$TARGET.tar.gz" "$VERSION"

  # The release gets the archives, SHA256SUMS and an attestation of each
  # archive. The attestation comes before the upload, so a refused one
  # publishes nothing. gh creates the release as a draft, uploads, then
  # publishes, and deletes the draft when an upload fails, so a failed run
  # leaves no release and a run again creates it. `--verify-tag` and gh
  # refuse a release that already exists, so no run replaces published
  # archives.
  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [version, ci, slow, install]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # gh creates the release and uploads its files.
      id-token: write # the attestation signs with the run's OIDC identity.
      attestations: write # the attestation is stored with the repository.
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # Only the build archives: other jobs in this run may upload
      # artifacts too.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: board-*
          path: dist
          merge-multiple: true
      - run: |
          cd dist
          sha256sum -- *.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - run: |
          notes="board $VERSION for aarch64-apple-darwin, x86_64-apple-darwin, aarch64-unknown-linux-gnu and x86_64-unknown-linux-gnu, with SHA256SUMS. Install it with Homebrew or the Board dmg, as https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/guide/getting-started.md says."
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --notes "$notes" dist/*
