# STANDARDS.md 21.
name: ci

# Pull requests and main run on Linux only. release.yml calls this workflow
# with macOS added before a release.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      os:
        description: JSON list of runners for the gates and plugin jobs.
        type: string
        default: '["ubuntu-24.04"]'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-nextest@0.9.146
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      # bin/lint and bin/test include the Python gates (STANDARDS.md P2).
      - run: bin/lint
      - run: bin/test
      # The budget controls only record lint.toml; bin/lint checks they agree.
      - name: viitta passes board check with the controls plugin installed
        run: |
          mkdir -p "$RUNNER_TEMP/data/board/plugins"
          ln -s "$PWD/plugins/controls" "$RUNNER_TEMP/data/board/plugins/controls"
          export PATH="$PWD/target/debug:$PATH" XDG_DATA_HOME="$RUNNER_TEMP/data"
          board check > /dev/null

  supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-deny@0.20.2,cargo-shear@1.14.0
      - run: cargo deny check
      - run: cargo shear

  # Static analysis of these workflows.
  zizmor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: zizmor@1.30.1
      - run: zizmor --offline .github/workflows

  # Mutation testing of the lines a pull request changes. It only reports;
  # a surviving mutant does not fail the pull request. Each mutant runs the
  # whole workspace's tests, because board-cli's tests catch mutants in the
  # crates it calls. That is about four times slower than one crate's tests,
  # so the mutants are split across four jobs to stay within the timeout.
  # board-scenario is test support with no tests of its own, and cargo-mutants
  # runs its baseline on the mutated crates only, so it is not mutated.
  # cargo-mutants sets each mutant's test timeout to five times that baseline,
  # which can be shorter than one run of the whole workspace (50 to 66 s here),
  # so the timeout is at least 180 s. Nextest's mutants profile fails a test
  # that runs past a minute and stops at the first failure, so a mutant that
  # makes a walk wait forever fails its run and counts as caught. The
  # baseline runs only the mutated crates' tests, so it does not check that
  # every test finishes within that minute. Once a correct test approaches
  # 60 s here, every mutant fails it and counts as caught, which would hide
  # missed mutants.
  mutants:
    if: github.event_name == 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest@0.9.146
      - run: git diff "origin/${BASE_REF}...HEAD" > pr.diff
        env:
          BASE_REF: ${{ github.base_ref }}
      - run: cargo mutants --in-diff pr.diff --test-tool nextest --test-workspace=true --exclude 'crates/board-scenario/**' --minimum-test-timeout 180 --shard "${SHARD}/4"
        env:
          SHARD: ${{ matrix.shard }}
          NEXTEST_PROFILE: mutants
