# STANDARDS.md 21: the pull-request lane.
name: ci

# Pull requests and main run the checks that catch failures often, on Linux,
# in parallel jobs. slow.yml runs mutants, fuzzing and Linux timing nightly,
# the jobs on macOS weekly, and all but mutants before a release. release.yml
# calls this workflow too.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Line tables keep panic locations and compile faster than full debug info.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Caches the dependencies' build, keyed on the toolchain, the CARGO* and
      # RUST* variables and Cargo.lock. A changed Cargo.lock restores the
      # newest cache with the same toolchain and variables. Only main saves,
      # so pull requests never evict main's cache.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: bin/lint rust
      - run: bin/test doc

  # The tests are split across jobs by a hash of each test's name, so a test
  # stays in the same job from run to run.
  test:
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3]
    name: test (${{ matrix.partition }}/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-nextest@0.9.146
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.partition == 1 }}
      - run: bin/test rust --partition "hash:${PARTITION}/3"
        env:
          PARTITION: ${{ matrix.partition }}

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.13.0"
      - run: bin/lint python
      - run: bin/test python
      # The budget controls only record lint.toml; bin/lint checks they agree.
      - name: viitta passes board check with the controls plugin installed
        run: |
          mkdir -p "$RUNNER_TEMP/data/board/plugins"
          ln -s "$PWD/plugins/controls" "$RUNNER_TEMP/data/board/plugins/controls"
          export PATH="$PWD/target/debug:$PATH" XDG_DATA_HOME="$RUNNER_TEMP/data"
          board check > /dev/null

  # board-ui builds and its screenshots are compared in the pinned arm64
  # Playwright image, so this job runs on an arm64 runner.
  ui:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: bin/lint ui
      - run: bin/test ui

  supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-deny@0.20.2,cargo-shear@1.14.0
      - run: cargo deny check
      - run: cargo shear

  # Static analysis of these workflows.
  zizmor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: zizmor@1.30.1
      - run: zizmor --offline .github/workflows
