[package]
name = "board-top"
version = "0.0.0"
description = "A terminal view of the changes in play on a board, grouped by the work map"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "board-top"
path = "src/main.rs"

# board-top reads Board only through the `board` command line, so it depends on
# no Board crate and Board does not depend on it.
[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["derive", "error-context", "help", "std", "usage"] }
# crossterm owns the terminal, as in `deadband top`.
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.18"
toml = { version = "1.1.6", default-features = false, features = ["parse", "serde", "std"] }

[dev-dependencies]
tempfile = "3.20.0"

[lints]
workspace = true
