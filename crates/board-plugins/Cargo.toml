[dependencies]
board-ops.workspace = true
board-plugin-boundary = { workspace = true, optional = true }
board-plugin-controls = { workspace = true, optional = true }
board-plugin-evals = { workspace = true, optional = true }
board-plugin-github = { workspace = true, optional = true }
board-plugin-plans = { workspace = true, optional = true }
board-plugin-requests = { workspace = true, optional = true }
board-plugin-runs = { workspace = true, optional = true }

[lints]
workspace = true
