[package]
name = "board-cli"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "board"
path = "src/main.rs"

[features]
default = ["artifacts", "boundary", "controls", "evals", "jira", "plans", "requests", "runs"]
artifacts = ["board-plugins/artifacts"]
boundary = ["board-plugins/boundary"]
controls = ["board-plugins/controls"]
evals = ["board-plugins/evals"]
jira = ["board-plugins/jira"]
plans = ["board-plugins/plans"]
requests = ["board-plugins/requests"]
runs = ["board-plugins/runs"]

[dependencies]
board-model.workspace = true
board-ops.workspace = true
board-plugin.workspace = true
board-plugins.workspace = true
board-serve.workspace = true
board-tree.workspace = true
clap.workspace = true
clap_complete.workspace = true
crumbkit = { workspace = true, features = ["complete"] }
nix.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
board-scenario.workspace = true
crumbkit-test.workspace = true
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
