[package]
name = "board-cli"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "board"
path = "src/main.rs"

[features]
default = ["artifacts", "boundary", "controls", "evals", "github", "jira", "notes", "plans", "prompts", "requests", "review", "runs", "share", "tasks"]
artifacts = ["board-plugins/artifacts"]
boundary = ["board-plugins/boundary"]
controls = ["board-plugins/controls"]
evals = ["board-plugins/evals"]
github = ["board-plugins/github"]
jira = ["board-plugins/jira"]
notes = ["board-plugins/notes"]
plans = ["board-plugins/plans"]
prompts = ["board-plugins/prompts"]
requests = ["board-plugins/requests"]
review = ["board-plugins/review"]
runs = ["board-plugins/runs"]
share = ["board-plugins/share"]
tasks = ["board-plugins/tasks"]

[dependencies]
board-model.workspace = true
board-ops.workspace = true
board-plugin.workspace = true
board-plugins.workspace = true
board-serve.workspace = true
board-tree.workspace = true
clap.workspace = true
clap_complete.workspace = true
crumbkit = { workspace = true, features = ["complete"] }
jiff.workspace = true
nix.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
board-scenario.workspace = true
crumbkit-test.workspace = true
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
