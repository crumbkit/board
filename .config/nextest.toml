# A flaky test is a defect, so nothing retries; one failure still lets the
# rest of the suite report.
[profile.default]
retries = 0
fail-fast = false

# The kill test waits on a FIFO. If a change to put left nothing to open the
# FIFO's other end, the test would wait forever, so nextest stops it and fails
# it after two minutes. It normally takes a few seconds.
[[profile.default.overrides]]
filter = 'binary_id(board-cli::kill)'
slow-timeout = { period = "60s", terminate-after = 2 }

# The mutants job in CI runs under this profile. A mutant can make a walk
# wait forever. With fail-fast off, every test that walks would then wait
# until cargo-mutants stops the whole run, and it would report the mutant as
# timed out. Under this profile a test still running after a minute fails and
# the first failure stops the run, so cargo-mutants reports the mutant as
# caught. The slowest test takes about 15 seconds on a laptop. cargo-mutants
# runs its baseline on the mutated crates' tests only, so nothing checks that
# every test finishes within the minute in CI. Once a correct test approaches
# 60 seconds in CI, every mutant fails it and counts as caught, which would
# hide missed mutants.
[profile.mutants]
fail-fast = { max-fail = 1, terminate = "immediate" }
slow-timeout = { period = "30s", terminate-after = 2 }
