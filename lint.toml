"$type" = "board/lint-config/v1"

# Budgets enforced by `cargo xtask lint`, which bin/lint runs. Words are
# whitespace-separated, counted across the whole file, code blocks included.
# Raise a number only in a change that says why; every run prints usage so the
# headroom is visible. STANDARDS.md 22 explains the starting values.

# N: everything an agent loads at session start. These files plus every file
# they import with Claude Code's `@path` syntax, each counted once.
[context]
entry = ["AGENTS.md", "CLAUDE.md"]
max_words = 1000

# M: the documentation map.
[docs_index]
file = "DOCS.md"
max_words = 400

# O: the documentation itself. Every directory under `directory`, itself
# included, is a node. The .md files directly inside a node hold at most
# max_words together; a subdirectory's words count only toward its own node.
# Lowered from 8,000 to 5,000 by the owner after the altitude pass (#60,
# 2026-10-04), raised to 5,500 on 2026-10-05 to describe the plugin, controls
# and CLI features built since, and applied per node on 2026-10-06 so that
# detail moves one level deeper when a node is full. Move detail down once a
# node passes 85% of max_words, rather than trimming to stay under it.
[docs]
directory = "docs"
max_words = 5500

# P: the plan. Added on 2026-10-06, when PLAN.md had grown to 7,377 words of
# mostly unbuilt sketches, more than the whole docs budget. Set at its trimmed
# length (932 words) plus about 15%.
[plan]
file = "PLAN.md"
max_words = 1075

# Q: the plan's milestone leaves. Each .md file directly in `directory` holds
# one milestone's design and holds at most max_words; PLAN.md links each leaf
# once and the directory has no subdirectories. Added on 2026-10-24 for the
# runs milestone, set at its leaf's length (1,128 words) plus about 15%.
[plan_leaves]
directory = "plan"
max_words = 1300

# Every Rust source file outside tests.rs files and tests/ directories.
[source]
max_lines = 800

# The exact number of #[expect] attributes in that source. Adding one means
# raising this in the same change; removing one means lowering it.
[expect]
count = 24
