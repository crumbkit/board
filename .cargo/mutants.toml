# cargo-mutants reads this file. Each `exclude_re` pattern names one
# equivalent mutant: a mutation that no input can tell apart from the code.
# The comment above each pattern gives the reason.

exclude_re = [
  # Tag is always inlined, so schemars never names a `$defs` entry after it,
  # and every schema Board builds holds a Tag only as a field, never at its
  # root, where schemars would make the name its title.
  'impl JsonSchema for Tag<R>>::schema_name -> .* with Cow::Borrowed\(""\)$',
  # Tag's name is never used: see the pattern above.
  'impl JsonSchema for Tag<R>>::schema_name -> .* with Cow::Borrowed\("xyzzy"\)$',
  # Tag's name is never used: see the first pattern.
  'impl JsonSchema for Tag<R>>::schema_name -> .* with Cow::Owned\("".to_owned\(\)\)$',
  # Tag's name is never used: see the first pattern.
  'impl JsonSchema for Tag<R>>::schema_name -> .* with Cow::Owned\("xyzzy".to_owned\(\)\)$',
  # Ref is always inlined, so schemars never names a `$defs` entry after it,
  # and every schema Board builds holds a Ref only as a field, never at its
  # root, where schemars would make the name its title.
  'impl JsonSchema for Ref<T>>::schema_name -> .* with Cow::Borrowed\(""\)$',
  # Ref's name is never used: see the pattern above.
  'impl JsonSchema for Ref<T>>::schema_name -> .* with Cow::Borrowed\("xyzzy"\)$',
  # Ref's name is never used: see the Ref pattern with an empty name.
  'impl JsonSchema for Ref<T>>::schema_name -> .* with Cow::Owned\("".to_owned\(\)\)$',
  # Ref's name is never used: see the Ref pattern with an empty name.
  'impl JsonSchema for Ref<T>>::schema_name -> .* with Cow::Owned\("xyzzy".to_owned\(\)\)$',
]
